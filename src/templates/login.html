<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Program Manager</title>
    <style>
        :root {
            --color-bg: #f5f6fa;
            --color-surface: #ffffff;
            --color-border: #e1e4ea;
            --color-text: #1f2328;
            --color-text-muted: #636c76;
            --color-primary: #2563eb;
            --color-primary-hover: #1d4ed8;
            --color-danger: #dc2626;
            --color-danger-bg: #fee2e2;
            --radius-md: 10px;
            --radius-lg: 16px;
            --shadow-lg: 0 10px 30px rgba(16, 24, 40, .12);
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --color-bg: #14151a;
                --color-surface: #1c1e26;
                --color-border: #2c2f3a;
                --color-text: #e7e9ee;
                --color-text-muted: #9aa1ac;
                --color-danger-bg: #3a1c1f;
                --shadow-lg: 0 10px 30px rgba(0, 0, 0, .5);
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background: var(--color-bg);
            color: var(--color-text);
        }

        .login-container {
            width: 100%;
            max-width: 380px;
            background: var(--color-surface);
            padding: 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--color-border);
        }

        .login-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            border-radius: var(--radius-md);
            background: var(--color-primary);
            color: white;
            font-size: 22px;
            font-weight: 700;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            margin: 0 0 4px;
        }

        .login-subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--color-text-muted);
            margin: 0 0 24px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .input-wrap {
            position: relative;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            color: var(--color-text);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            transition: border-color .15s ease, box-shadow .15s ease;
        }

        input::placeholder {
            color: var(--color-text-muted);
        }

        input:focus-visible {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .18);
        }

        .password-wrap input {
            padding-right: 44px;
        }

        .toggle-password {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: var(--color-text-muted);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 8px;
            border-radius: 6px;
            cursor: pointer;
        }

        .toggle-password:hover {
            background: var(--color-border);
            color: var(--color-text);
        }

        .toggle-password:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 8px;
            padding: 11px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            color: white;
            background: var(--color-primary);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background .15s ease, transform .1s ease;
        }

        button[type="submit"]:hover {
            background: var(--color-primary-hover);
        }

        button[type="submit"]:active {
            transform: scale(.98);
        }

        button[type="submit"]:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }

        .error {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            padding: 10px 12px;
            font-size: 13px;
            color: var(--color-danger);
            background: var(--color-danger-bg);
            border-radius: var(--radius-md);
        }
    </style>
</head>
<body>
    <main class="login-container">
        <div class="login-brand" aria-hidden="true">PM</div>
        <h1>Sign in</h1>
        <p class="login-subtitle">Access Program Manager with your credentials</p>

        <form method="POST" novalidate>
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Your username"
                       autocomplete="username" autofocus required
                       {% if error %}aria-describedby="login-error"{% endif %}>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="input-wrap password-wrap">
                    <input type="password" id="password" name="password" placeholder="Your password"
                           autocomplete="current-password" required
                           {% if error %}aria-describedby="login-error"{% endif %}>
                    <button type="button" class="toggle-password" id="togglePassword"
                            aria-pressed="false" aria-label="Show password">Show</button>
                </div>
            </div>

            <button type="submit">Sign in</button>

            {% if error %}
                <p class="error" id="login-error" role="alert">{{ error }}</p>
            {% endif %}
        </form>
    </main>

    <script>
        var toggleBtn = document.getElementById("togglePassword");
        var passwordInput = document.getElementById("password");

        toggleBtn.addEventListener("click", function () {
            var isHidden = passwordInput.type === "password";
            passwordInput.type = isHidden ? "text" : "password";
            toggleBtn.textContent = isHidden ? "Hide" : "Show";
            toggleBtn.setAttribute("aria-pressed", String(isHidden));
            toggleBtn.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
        });
    </script>
</body>
</html>
